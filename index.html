<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Kerusakan & Rehab Rekon</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Loading Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Marquee Animation for Admin Message */
        .marquee-container { overflow: hidden; white-space: nowrap; }
        .marquee-content { display: inline-block; animation: marquee 20s linear infinite; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- KONFIGURASI LINK SPREADSHEET ---
        // Ganti URL di bawah ini dengan Link "Publish to Web" (CSV) dari masing-masing Sheet Anda.
        const CONFIG = {
            // Sheet 1: Data Kerusakan
            DATA_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSingzjvkI_INEqsjcOD2vYX5yZNOn8fikomTNU70munYuxBmjywDRrWNq0ehZTHN2OHSvVZE-xOKgN/pub?gid=1554825227&single=true&output=csv",
            
            // Sheet 2: Users (Email, Password, Role, NamaLengkap, Dinas, NoHP)
            USERS_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSingzjvkI_INEqsjcOD2vYX5yZNOn8fikomTNU70munYuxBmjywDRrWNq0ehZTHN2OHSvVZE-xOKgN/pub?gid=0&single=true&output=csv", // Kosongkan untuk menggunakan User Mock Data
            
            // Sheet 3: Settings (Key, Value) -> Kelurahan, Pesan Admin
            SETTINGS_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSingzjvkI_INEqsjcOD2vYX5yZNOn8fikomTNU70munYuxBmjywDRrWNq0ehZTHN2OHSvVZE-xOKgN/pub?gid=762390479&single=true&output=csv" // Kosongkan untuk menggunakan Settings Mock Data
        };

        // --- COMPONENTS ---

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const StatusBadge = ({ status }) => {
            const safeStatus = (status || "").trim();
            const lowerStatus = safeStatus.toLowerCase();
            
            let colorClass = 'bg-gray-100 text-gray-700 border-gray-200';
            
            if (lowerStatus === 'aktif' || lowerStatus === 'diterima') colorClass = 'bg-green-100 text-green-700 border-green-200';
            else if (lowerStatus === 'verifikasi' || lowerStatus === 'diproses') colorClass = 'bg-yellow-100 text-yellow-700 border-yellow-200';
            else if (lowerStatus === 'selesai') colorClass = 'bg-blue-100 text-blue-700 border-blue-200';
            else if (lowerStatus === 'ditolak') colorClass = 'bg-red-100 text-red-700 border-red-200';
            
            return (
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium border ${colorClass}`}>
                    {safeStatus || "Pending"}
                </span>
            );
        };

        const DamageBar = ({ label, value }) => {
            const valStr = value || "0%";
            const percentMatch = valStr.toString().match(/(\d+)%/);
            const percent = percentMatch ? parseInt(percentMatch[1]) : 0;
            
            let color = "bg-green-500";
            if(percent > 30) color = "bg-yellow-500";
            if(percent > 60) color = "bg-red-500";

            return (
                <div className="mb-2">
                    <div className="flex justify-between text-xs mb-1">
                        <span className="text-gray-500">{label}</span>
                        <span className="font-semibold text-gray-700">{valStr}</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-1.5">
                        <div className={`h-1.5 rounded-full ${color}`} style={{ width: `${percent}%` }}></div>
                    </div>
                </div>
            );
        };

        // --- MOCK DATA FOR FALLBACK ---
        
        const MOCK_USERS = [
            { Email: "subkelpk@rehabrekon.com", Password: "admin123", Role: "admin", NamaLengkap: "Administrator", Dinas: "BPBD DKI JAKARTA", NoHP: "08123456789" },
            { Email: "test@gmail.com", Password: "test", Role: "user", NamaLengkap: "User Test", Dinas: "Kelurahan Test", NoHP: "08987654321" }
        ];

        const MOCK_SETTINGS = [
            { A: "Kelurahan", B: "Jembatan Besi (Demo Mode)" },
            { A: "Pesan Admin", B: "Selamat datang di Sistem Rehab Rekon. Pastikan data yang diinput valid." }
        ];

        const MOCK_DATA = [
            {
                id: "3de03a6b-206a",
                email: "contoh@rehabrekon.com",
                timestamp: "23/01/2026 13:47:07",
                nama: "CONTOH DATA (Connect Sheet Anda)",
                alamat: "Jl. Contoh Penggunaan No. 1",
                rt: "01", rw: "01",
                luasBangunan: 1, panjangBangunan: 1, ukuranTotal: 1.00,
                atap: "Sedang - 50%", dinding: "Sedang - 50%", lantai: "Baik - 0%", pondasi: "Baik - 0%",
                keterangan: "Data ini muncul karena link sheet belum valid", jenisBangunan: "SHM",
                hargaNJOP: 1000000,
                fotoURL: "https://images.unsplash.com/photo-1583590130932-e30018897036?auto=format&fit=crop&q=80&w=800",
                pekerjaan: "Wiraswasta", penghasilan: 5000000,
                jmlKeluarga: 4, jmlAnak: 2,
                hilangPenghasilan: 0, asetTerdampak: "Rumah Tinggal", kerugianAset: 50000000,
                status: "Verifikasi"
            }
        ];

        // --- LOGIN PAGE COMPONENT ---

        const LoginPage = ({ onLogin, loading, error }) => {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin(email, password);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 px-4">
                    <div className="max-w-md w-full bg-white rounded-xl shadow-xl overflow-hidden">
                        <div className="bg-blue-600 p-8 text-center">
                            <div className="bg-white/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
                                <Icon name="shield-check" size={32} className="text-white" />
                            </div>
                            <h2 className="text-2xl font-bold text-white">SiGap Bencana</h2>
                            <p className="text-blue-100 text-sm mt-1">Sistem Login Terpadu</p>
                        </div>
                        
                        <div className="p-8">
                            {error && (
                                <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-6 flex items-center gap-2 border border-red-100">
                                    <Icon name="alert-circle" size={16} /> {error}
                                </div>
                            )}

                            <form onSubmit={handleSubmit} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <Icon name="mail" size={18} className="text-gray-400" />
                                        </div>
                                        <input 
                                            type="email" 
                                            required
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            className="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
                                            placeholder="nama@instansi.com"
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <Icon name="lock" size={18} className="text-gray-400" />
                                        </div>
                                        <input 
                                            type="password" 
                                            required
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            className="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
                                            placeholder="••••••••"
                                        />
                                    </div>
                                </div>
                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 flex justify-center items-center gap-2"
                                >
                                    {loading ? <div className="loader w-5 h-5 border-t-white border-2"></div> : "Masuk Aplikasi"}
                                </button>
                            </form>
                            
                            <div className="mt-6 text-center text-xs text-gray-400">
                                <p>Gunakan akun yang terdaftar di Spreadsheet Users.</p>
                                <p className="mt-1">Demo: subkelpk@rehabrekon.com / admin123</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD COMPONENT ---

        const Dashboard = ({ user, onLogout, settings }) => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState("");
            const [viewMode, setViewMode] = useState("grid");
            const [selectedItem, setSelectedItem] = useState(null);

            // Fetch Data Kerusakan
            useEffect(() => {
                const fetchData = async () => {
                    setLoading(true);
                    
                    if (!CONFIG.DATA_URL || CONFIG.DATA_URL.includes("docs.google.com/spreadsheets/d/e/2PACX-1vR6y7q4z3F1f1r2x3g4h5i6j7k8l9m0n1o2p3q4r5s6t7u8v9w0x1y2z3a4b5c6d7e8f9g0h1i2j3k4")) {
                        setData(MOCK_DATA);
                        setLoading(false);
                        return;
                    }

                    Papa.parse(CONFIG.DATA_URL, {
                        download: true,
                        header: true,
                        complete: (results) => {
                            try {
                                const transformedData = results.data
                                    .filter(row => row.ID || row.Nama)
                                    .map(row => ({
                                        id: row.ID || Math.random().toString(36).substr(2, 9),
                                        email: row.UserEmail || "",
                                        timestamp: row.Timestamp || "",
                                        nama: row.Nama || "Tanpa Nama",
                                        alamat: row.Alamat || "",
                                        rt: row.RT || "-", rw: row.RW || "-",
                                        luasBangunan: row.LuasBangunan || 0, 
                                        panjangBangunan: row.PanjangBangunan || 0,
                                        ukuranTotal: row.UkuranTotal || 0,
                                        atap: row.Atap || "Baik - 0%",
                                        dinding: row.Dinding || "Baik - 0%",
                                        lantai: row.Lantai || "Baik - 0%",
                                        pondasi: row.Pondasi || "Baik - 0%",
                                        keterangan: row.Keterangan || "",
                                        jenisBangunan: row.JenisBangunan || "-",
                                        hargaNJOP: parseFloat((row.HargaNJOP || "0").toString().replace(/[^0-9.-]+/g,"")),
                                        fotoURL: row.FotoURL || "https://placehold.co/600x400?text=No+Image",
                                        pekerjaan: row.Pekerjaan || "-",
                                        penghasilan: parseFloat((row.Penghasilan || "0").toString().replace(/[^0-9.-]+/g,"")),
                                        jmlKeluarga: row.JmlKeluarga || 0,
                                        jmlAnak: row.JmlAnakSekolah || 0,
                                        hilangPenghasilan: row.HilangPenghasilan || 0,
                                        asetTerdampak: row.AsetTerdampak || "-",
                                        kerugianAset: parseFloat((row.KerugianAset || "0").toString().replace(/[^0-9.-]+/g,"")),
                                        status: row.Status || "Verifikasi"
                                    }));
                                setData(transformedData);
                            } catch (err) {
                                console.error("Error parsing data", err);
                                setData(MOCK_DATA);
                            }
                            setLoading(false);
                        },
                        error: () => {
                            setData(MOCK_DATA);
                            setLoading(false);
                        }
                    });
                };
                fetchData();
            }, []);

            const stats = useMemo(() => {
                const total = data.length;
                const totalLoss = data.reduce((acc, curr) => acc + (curr.kerugianAset || 0), 0);
                const active = data.filter(d => (d.status || "").toLowerCase().includes('verifikasi') || (d.status || "").toLowerCase().includes('aktif')).length;
                return { total, totalLoss, active };
            }, [data]);

            const filteredData = data.filter(item => 
                (item.nama || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.alamat || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.status || "").toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Get Settings Values
            const kelurahan = settings.find(s => s.key === 'Kelurahan')?.value || "Data Dashboard";
            const adminMessage = settings.find(s => s.key === 'Pesan Admin')?.value || "";

            const StatCard = ({ title, value, icon, color }) => (
                <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition">
                    <div className="flex justify-between items-start">
                        <div>
                            <p className="text-sm font-medium text-gray-500 mb-1">{title}</p>
                            <h3 className="text-2xl font-bold text-gray-800">{value}</h3>
                        </div>
                        <div className={`p-3 rounded-lg ${color} bg-opacity-10`}>
                            <div className={color.replace('bg-', 'text-')}>
                                <Icon name={icon} size={24} />
                            </div>
                        </div>
                    </div>
                </div>
            );

            const DetailModal = ({ item, onClose }) => {
                if (!item) return null;
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
                            <div className="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center z-10">
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800">Detail Laporan</h2>
                                    <p className="text-sm text-gray-500">ID: {item.id}</p>
                                </div>
                                <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full transition">
                                    <Icon name="x" />
                                </button>
                            </div>
                            
                            <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <div className="aspect-video bg-gray-100 rounded-lg overflow-hidden mb-4 border">
                                        <img src={item.fotoURL} className="w-full h-full object-cover" onError={(e) => {e.target.src='https://placehold.co/600x400?text=No+Image'}} />
                                    </div>
                                    <div className="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                                        <span className="text-gray-600 font-medium">Status</span>
                                        <StatusBadge status={item.status} />
                                    </div>
                                </div>
                                <div className="space-y-6">
                                    <div>
                                        <h3 className="font-semibold text-gray-800 mb-2">Informasi</h3>
                                        <div className="grid grid-cols-2 gap-4 text-sm bg-gray-50 p-4 rounded border">
                                            <div>
                                                <p className="text-xs text-gray-500">Nama Pelapor</p>
                                                <p className="font-medium">{item.nama}</p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-gray-500">Alamat</p>
                                                <p className="font-medium">{item.alamat}</p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-gray-500">Kerugian</p>
                                                <p className="font-medium text-red-600">Rp {item.kerugianAset.toLocaleString('id-ID')}</p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-gray-500">RT/RW</p>
                                                <p className="font-medium">{item.rt}/{item.rw}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-white border rounded-lg p-4 shadow-sm">
                                        <DamageBar label="Atap" value={item.atap} />
                                        <DamageBar label="Dinding" value={item.dinding} />
                                    </div>
                                </div>
                            </div>
                            <div className="bg-gray-50 px-6 py-4 rounded-b-xl flex justify-end gap-3">
                                <button onClick={onClose} className="px-4 py-2 border rounded-lg hover:bg-gray-100">Tutup</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-10">
                    {/* Top Admin Banner */}
                    {adminMessage && (
                        <div className="bg-yellow-500 text-white text-sm py-2 px-4 overflow-hidden relative">
                             <div className="marquee-container">
                                <div className="marquee-content font-medium">
                                    <span className="mx-4">📢 INFO PENTING: {adminMessage}</span>
                                    <span className="mx-4">📢 INFO PENTING: {adminMessage}</span>
                                    <span className="mx-4">📢 INFO PENTING: {adminMessage}</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-white border-b sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center gap-3">
                                    <div className="bg-blue-600 text-white p-2 rounded-lg">
                                        <Icon name="layout-dashboard" size={24} />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900 leading-tight">SiGap {kelurahan}</h1>
                                        <p className="text-xs text-gray-500 hidden sm:block">Sistem Data Kerusakan & Rehab Rekon</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-6">
                                    {/* User Profile */}
                                    <div className="hidden md:flex flex-col items-end">
                                        <span className="text-sm font-semibold text-gray-800">{user.NamaLengkap}</span>
                                        <span className="text-xs text-gray-500 bg-gray-100 px-2 rounded-full">{user.Dinas} ({user.Role})</span>
                                    </div>
                                    
                                    <button 
                                        onClick={onLogout}
                                        className="p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-full transition"
                                        title="Keluar"
                                    >
                                        <Icon name="log-out" size={20} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Stats Row */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <StatCard title="Total Laporan" value={loading ? "..." : stats.total} icon="file-text" color="bg-blue-500" />
                            <StatCard title="Total Kerugian" value={loading ? "..." : `Rp ${(stats.totalLoss / 1000000).toFixed(0)} Jt`} icon="dollar-sign" color="bg-red-500" />
                            <StatCard title="Butuh Verifikasi" value={loading ? "..." : stats.active} icon="clock" color="bg-yellow-500" />
                        </div>

                        {/* Controls */}
                        <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                            <div className="relative w-full md:w-96">
                                <Icon name="search" size={18} className="absolute left-3 top-3 text-gray-400" />
                                <input
                                    type="text"
                                    className="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    placeholder="Cari data..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            <div className="flex bg-white rounded-lg border p-1">
                                <button onClick={() => setViewMode('grid')} className={`p-2 rounded ${viewMode === 'grid' ? 'bg-gray-100 text-blue-600' : 'text-gray-500'}`}><Icon name="layout-grid" size={20}/></button>
                                <button onClick={() => setViewMode('table')} className={`p-2 rounded ${viewMode === 'table' ? 'bg-gray-100 text-blue-600' : 'text-gray-500'}`}><Icon name="table" size={20}/></button>
                            </div>
                        </div>

                        {/* Data Content */}
                        {loading ? (
                            <div className="flex justify-center py-20"><div className="loader"></div></div>
                        ) : filteredData.length === 0 ? (
                            <div className="text-center py-20 bg-white rounded-xl border border-dashed">
                                <Icon name="search-x" size={48} className="mx-auto text-gray-300 mb-2"/>
                                <p className="text-gray-500">Data tidak ditemukan</p>
                            </div>
                        ) : viewMode === 'grid' ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredData.map(item => (
                                    <div key={item.id} className="bg-white rounded-xl border hover:shadow-lg transition overflow-hidden group">
                                        <div className="h-48 bg-gray-200 relative">
                                            <img src={item.fotoURL} className="w-full h-full object-cover group-hover:scale-105 transition" onError={(e) => {e.target.src='https://placehold.co/600x400?text=No+Image'}} />
                                            <div className="absolute top-3 right-3"><StatusBadge status={item.status} /></div>
                                        </div>
                                        <div className="p-5">
                                            <h3 className="font-bold text-gray-800 truncate">{item.nama}</h3>
                                            <p className="text-sm text-gray-500 mb-4">{item.alamat}</p>
                                            <button onClick={() => setSelectedItem(item)} className="w-full py-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-medium hover:bg-blue-100">Detail</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white rounded-xl border overflow-x-auto">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nama</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Alamat</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Kerugian</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                            <th className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-200">
                                        {filteredData.map(item => (
                                            <tr key={item.id} className="hover:bg-gray-50">
                                                <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{item.nama}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500 truncate max-w-xs">{item.alamat}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Rp {item.kerugianAset.toLocaleString('id-ID')}</td>
                                                <td className="px-6 py-4 whitespace-nowrap"><StatusBadge status={item.status} /></td>
                                                <td className="px-6 py-4 whitespace-nowrap text-right text-sm">
                                                    <button onClick={() => setSelectedItem(item)} className="text-blue-600 hover:text-blue-900">Lihat</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </main>

                    {selectedItem && <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />}
                </div>
            );
        };

        // --- MAIN APP (AUTH MANAGER) ---

        function App() {
            const [user, setUser] = useState(null);
            const [settings, setSettings] = useState([]);
            const [loadingUser, setLoadingUser] = useState(false);
            const [loginError, setLoginError] = useState("");
            
            // Check for existing session
            useEffect(() => {
                const storedUser = localStorage.getItem('siGapUser');
                if (storedUser) {
                    setUser(JSON.parse(storedUser));
                }
                
                // Fetch Settings Immediately regardless of login
                fetchSettings();
            }, []);

            const fetchSettings = () => {
                if (!CONFIG.SETTINGS_URL) {
                    setSettings(MOCK_SETTINGS.map(s => ({ key: s.A, value: s.B })));
                    return;
                }
                Papa.parse(CONFIG.SETTINGS_URL, {
                    download: true,
                    header: false, // Settings sheet usually just key-value without complex headers
                    complete: (results) => {
                        // Assuming Column A is Key, Column B is Value
                        // Skip row 1 if it is header
                        const parsedSettings = results.data.slice(1).map(row => ({
                            key: row[0],
                            value: row[1]
                        })).filter(s => s.key);
                        setSettings(parsedSettings);
                    }
                });
            };

            const handleLogin = (email, password) => {
                setLoadingUser(true);
                setLoginError("");

                if (!CONFIG.USERS_URL) {
                    // Use Mock Auth
                    setTimeout(() => {
                        const foundUser = MOCK_USERS.find(u => u.Email === email && u.Password === password);
                        if (foundUser) {
                            setUser(foundUser);
                            localStorage.setItem('siGapUser', JSON.stringify(foundUser));
                        } else {
                            setLoginError("Email atau Password salah!");
                        }
                        setLoadingUser(false);
                    }, 1000);
                    return;
                }

                // Real Auth via CSV
                Papa.parse(CONFIG.USERS_URL, {
                    download: true,
                    header: true,
                    complete: (results) => {
                        const users = results.data;
                        const foundUser = users.find(u => 
                            u.Email?.trim() === email.trim() && 
                            u.Password?.trim() === password.trim()
                        );
                        
                        if (foundUser) {
                            setUser(foundUser);
                            localStorage.setItem('siGapUser', JSON.stringify(foundUser));
                        } else {
                            setLoginError("Email atau Password salah!");
                        }
                        setLoadingUser(false);
                    },
                    error: () => {
                        setLoginError("Gagal menghubungi database user.");
                        setLoadingUser(false);
                    }
                });
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('siGapUser');
            };

            return (
                <div>
                    {!user ? (
                        <LoginPage onLogin={handleLogin} loading={loadingUser} error={loginError} />
                    ) : (
                        <Dashboard user={user} onLogout={handleLogout} settings={settings} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
