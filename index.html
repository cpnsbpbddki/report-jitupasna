<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Data Kerusakan & Rehab Rekon</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Loading Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- KONFIGURASI GOOGLE SHEET ---
        // GANTI URL DI BAWAH INI DENGAN LINK CSV DARI "PUBLISH TO WEB" GOOGLE SHEET ANDA
        // Cara: File > Share > Publish to web > Pilih Sheet > Pilih format CSV > Publish > Copy Link
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSingzjvkI_INEqsjcOD2vYX5yZNOn8fikomTNU70munYuxBmjywDRrWNq0ehZTHN2OHSvVZE-xOKgN/pub?gid=1554825227&single=true&output=csv"; 
        
        // Catatan: URL di atas adalah contoh dummy agar tidak error saat pertama kali dijalankan.
        // Jika URL Anda kosong atau salah, aplikasi akan menggunakan MOCK_DATA sebagai fallback.

        // --- COMPONENTS ---

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const StatusBadge = ({ status }) => {
            // Normalisasi status untuk handle case sensitive atau spasi
            const safeStatus = (status || "").trim();
            const lowerStatus = safeStatus.toLowerCase();
            
            let colorClass = 'bg-gray-100 text-gray-700 border-gray-200';
            
            if (lowerStatus === 'aktif' || lowerStatus === 'diterima') colorClass = 'bg-green-100 text-green-700 border-green-200';
            else if (lowerStatus === 'verifikasi' || lowerStatus === 'diproses') colorClass = 'bg-yellow-100 text-yellow-700 border-yellow-200';
            else if (lowerStatus === 'selesai') colorClass = 'bg-blue-100 text-blue-700 border-blue-200';
            else if (lowerStatus === 'ditolak') colorClass = 'bg-red-100 text-red-700 border-red-200';
            
            return (
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium border ${colorClass}`}>
                    {safeStatus || "Pending"}
                </span>
            );
        };

        const DamageBar = ({ label, value }) => {
            const valStr = value || "0%";
            // Extract percentage number
            const percentMatch = valStr.toString().match(/(\d+)%/);
            const percent = percentMatch ? parseInt(percentMatch[1]) : 0;
            
            let color = "bg-green-500";
            if(percent > 30) color = "bg-yellow-500";
            if(percent > 60) color = "bg-red-500";

            return (
                <div className="mb-2">
                    <div className="flex justify-between text-xs mb-1">
                        <span className="text-gray-500">{label}</span>
                        <span className="font-semibold text-gray-700">{valStr}</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-1.5">
                        <div className={`h-1.5 rounded-full ${color}`} style={{ width: `${percent}%` }}></div>
                    </div>
                </div>
            );
        };

        const DetailModal = ({ item, onClose }) => {
            if (!item) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center z-10">
                            <div>
                                <h2 className="text-xl font-bold text-gray-800">Detail Laporan</h2>
                                <p className="text-sm text-gray-500">ID: {item.id}</p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full transition">
                                <Icon name="x" />
                            </button>
                        </div>
                        
                        <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                            {/* Left Column: Image & Status */}
                            <div>
                                <div className="aspect-video bg-gray-100 rounded-lg overflow-hidden mb-4 border">
                                    <img 
                                        src={item.fotoURL} 
                                        alt="Foto Kerusakan" 
                                        className="w-full h-full object-cover"
                                        onError={(e) => {e.target.src='https://placehold.co/600x400?text=No+Image'}}
                                    />
                                </div>
                                <div className="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                                    <span className="text-gray-600 font-medium">Status Laporan</span>
                                    <StatusBadge status={item.status} />
                                </div>
                                <div className="mt-4 space-y-2">
                                    <h3 className="font-semibold text-gray-800 flex items-center gap-2">
                                        <Icon name="user" size={16}/> Informasi Pelapor
                                    </h3>
                                    <div className="text-sm text-gray-600 pl-6 space-y-1">
                                        <p><span className="font-medium">Nama:</span> {item.nama}</p>
                                        <p><span className="font-medium">Email:</span> {item.email}</p>
                                        <p><span className="font-medium">Pekerjaan:</span> {item.pekerjaan}</p>
                                        <p><span className="font-medium">Penghasilan:</span> {typeof item.penghasilan === 'number' ? `Rp ${item.penghasilan.toLocaleString('id-ID')}` : item.penghasilan}</p>
                                        <p><span className="font-medium">Anggota Keluarga:</span> {item.jmlKeluarga} (Anak Sekolah: {item.jmlAnak})</p>
                                    </div>
                                </div>
                            </div>

                            {/* Right Column: Technical Details */}
                            <div className="space-y-6">
                                <div>
                                    <h3 className="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                                        <Icon name="map-pin" size={16}/> Lokasi & Bangunan
                                    </h3>
                                    <div className="grid grid-cols-2 gap-4 text-sm">
                                        <div className="bg-gray-50 p-3 rounded border">
                                            <p className="text-gray-500 text-xs">Alamat</p>
                                            <p className="font-medium">{item.alamat}</p>
                                            <p className="text-xs mt-1">RT {item.rt} / RW {item.rw}</p>
                                        </div>
                                        <div className="bg-gray-50 p-3 rounded border">
                                            <p className="text-gray-500 text-xs">Legalitas</p>
                                            <p className="font-medium">{item.jenisBangunan}</p>
                                            <p className="text-xs mt-1">NJOP: {typeof item.hargaNJOP === 'number' ? `Rp ${item.hargaNJOP.toLocaleString('id-ID')}` : item.hargaNJOP}</p>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                                        <Icon name="activity" size={16}/> Analisa Kerusakan
                                    </h3>
                                    <div className="bg-white border rounded-lg p-4 shadow-sm">
                                        <DamageBar label="Atap" value={item.atap} />
                                        <DamageBar label="Dinding" value={item.dinding} />
                                        <DamageBar label="Lantai" value={item.lantai} />
                                        <DamageBar label="Pondasi" value={item.pondasi} />
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                                        <Icon name="dollar-sign" size={16}/> Estimasi Kerugian
                                    </h3>
                                    <div className="bg-red-50 border border-red-100 p-4 rounded-lg">
                                        <p className="text-sm text-red-600">Total Kerugian Aset</p>
                                        <p className="text-2xl font-bold text-red-700">{typeof item.kerugianAset === 'number' ? `Rp ${item.kerugianAset.toLocaleString('id-ID')}` : item.kerugianAset}</p>
                                        <p className="text-xs text-red-500 mt-1">Aset: {item.asetTerdampak}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-gray-50 px-6 py-4 rounded-b-xl flex justify-end gap-3">
                             <button onClick={onClose} className="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50">
                                Tutup
                            </button>
                            <button className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 flex items-center gap-2">
                                <Icon name="printer" size={16}/> Cetak Laporan
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const StatCard = ({ title, value, icon, color, trend }) => (
            <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition">
                <div className="flex justify-between items-start">
                    <div>
                        <p className="text-sm font-medium text-gray-500 mb-1">{title}</p>
                        <h3 className="text-2xl font-bold text-gray-800">{value}</h3>
                    </div>
                    <div className={`p-3 rounded-lg ${color} bg-opacity-10`}>
                        <div className={color.replace('bg-', 'text-')}>
                            <Icon name={icon} size={24} />
                        </div>
                    </div>
                </div>
                {trend && <p className="text-xs text-green-600 mt-4 flex items-center gap-1"><Icon name="trending-up" size={12}/> {trend}</p>}
            </div>
        );

        // --- FALLBACK MOCK DATA ---
        // Digunakan jika Google Sheet belum disetup atau gagal load
        const MOCK_DATA = [
            {
                id: "3de03a6b-206a",
                email: "contoh@rehabrekon.com",
                timestamp: "23/01/2026 13:47:07",
                nama: "CONTOH DATA (Connect Sheet Anda)",
                alamat: "Jl. Contoh Penggunaan No. 1",
                rt: "01", rw: "01",
                luasBangunan: 1, panjangBangunan: 1, ukuranTotal: 1.00,
                atap: "Sedang - 50%", dinding: "Sedang - 50%", lantai: "Baik - 0%", pondasi: "Baik - 0%",
                keterangan: "Data ini muncul karena link sheet belum valid", jenisBangunan: "SHM",
                hargaNJOP: 1000000,
                fotoURL: "https://images.unsplash.com/photo-1583590130932-e30018897036?auto=format&fit=crop&q=80&w=800",
                pekerjaan: "Wiraswasta", penghasilan: 5000000,
                jmlKeluarga: 4, jmlAnak: 2,
                hilangPenghasilan: 0, asetTerdampak: "Rumah Tinggal", kerugianAset: 50000000,
                status: "Contoh"
            }
        ];

        function App() {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");
            const [viewMode, setViewMode] = useState("grid");
            const [selectedItem, setSelectedItem] = useState(null);

            // Fetch Data from Google Sheet CSV
            useEffect(() => {
                const fetchData = async () => {
                    setLoading(true);
                    
                    // Cek jika URL masih default/kosong, gunakan mock data
                    if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes("docs.google.com/spreadsheets/d/e/2PACX-1vR6y7q4z3F1f1r2x3g4h5i6j7k8l9m0n1o2p3q4r5s6t7u8v9w0x1y2z3a4b5c6d7e8f9g0h1i2j3k4")) {
                        console.log("Using Mock Data (URL not configured)");
                        setData(MOCK_DATA);
                        setLoading(false);
                        return;
                    }

                    Papa.parse(GOOGLE_SHEET_CSV_URL, {
                        download: true,
                        header: true,
                        complete: (results) => {
                            try {
                                // Transform data CSV ke format aplikasi
                                // Kita asumsikan header CSV sesuai dengan file HTML sebelumnya
                                const transformedData = results.data
                                    .filter(row => row.ID || row.Nama) // Filter baris kosong
                                    .map(row => ({
                                        id: row.ID || Math.random().toString(36).substr(2, 9),
                                        email: row.UserEmail || "",
                                        timestamp: row.Timestamp || "",
                                        nama: row.Nama || "Tanpa Nama",
                                        alamat: row.Alamat || "",
                                        rt: row.RT || "-", rw: row.RW || "-",
                                        luasBangunan: row.LuasBangunan || 0, 
                                        panjangBangunan: row.PanjangBangunan || 0,
                                        ukuranTotal: row.UkuranTotal || 0,
                                        atap: row.Atap || "Baik - 0%",
                                        dinding: row.Dinding || "Baik - 0%",
                                        lantai: row.Lantai || "Baik - 0%",
                                        pondasi: row.Pondasi || "Baik - 0%",
                                        keterangan: row.Keterangan || "",
                                        jenisBangunan: row.JenisBangunan || "-",
                                        hargaNJOP: parseFloat((row.HargaNJOP || "0").toString().replace(/[^0-9.-]+/g,"")),
                                        fotoURL: row.FotoURL || "https://placehold.co/600x400?text=No+Image",
                                        pekerjaan: row.Pekerjaan || "-",
                                        penghasilan: parseFloat((row.Penghasilan || "0").toString().replace(/[^0-9.-]+/g,"")),
                                        jmlKeluarga: row.JmlKeluarga || 0,
                                        jmlAnak: row.JmlAnakSekolah || 0,
                                        hilangPenghasilan: row.HilangPenghasilan || 0,
                                        asetTerdampak: row.AsetTerdampak || "-",
                                        kerugianAset: parseFloat((row.KerugianAset || "0").toString().replace(/[^0-9.-]+/g,"")),
                                        status: row.Status || "Verifikasi"
                                    }));
                                
                                setData(transformedData);
                                setLoading(false);
                            } catch (err) {
                                console.error("Error processing CSV data:", err);
                                setError("Gagal memproses data dari Spreadsheet.");
                                setData(MOCK_DATA); // Fallback
                                setLoading(false);
                            }
                        },
                        error: (err) => {
                            console.error("Error fetching CSV:", err);
                            setError("Gagal mengambil data. Pastikan link CSV benar & publik.");
                            setData(MOCK_DATA); // Fallback
                            setLoading(false);
                        }
                    });
                };

                fetchData();
            }, []);
            
            // Statistics calculation
            const stats = useMemo(() => {
                const total = data.length;
                const totalLoss = data.reduce((acc, curr) => acc + (curr.kerugianAset || 0), 0);
                const active = data.filter(d => (d.status || "").toLowerCase().includes('verifikasi') || (d.status || "").toLowerCase().includes('aktif')).length;
                return { total, totalLoss, active };
            }, [data]);

            // Filtering
            const filteredData = data.filter(item => 
                (item.nama || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.alamat || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.status || "").toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="min-h-screen pb-10">
                    {/* Header */}
                    <header className="bg-white border-b sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center gap-3">
                                    <div className="bg-blue-600 text-white p-2 rounded-lg">
                                        <Icon name="shield-alert" size={24} />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900 leading-tight">Live Report JITUPASNA</h1>
                                        <p className="text-xs text-gray-500">Subkelompok Penilaian Kerusakan - BPBD DKI Provinsi DKI Jakarta</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="hidden md:flex flex-col items-end mr-2">
                                         <span className="text-xs text-green-600 font-medium bg-green-50 px-2 py-0.5 rounded border border-green-100 flex items-center gap-1">
                                            <div className="w-1.5 h-1.5 rounded-full bg-green-500"></div> 
                                            {loading ? 'Menghubungkan...' : 'Google Sheets Terhubung'}
                                        </span>
                                    </div>
                                    <div className="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold border border-blue-200">
                                        A
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        
                        {/* Status Message if Mock Data is used */}
                        {!loading && data === MOCK_DATA && (
                            <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded-r">
                                <div className="flex">
                                    <div className="flex-shrink-0">
                                        <Icon name="info" className="text-yellow-400" />
                                    </div>
                                    <div className="ml-3">
                                        <p className="text-sm text-yellow-700">
                                            Mode Demo: Menggunakan data contoh. Silakan edit kode dan masukkan link CSV Google Sheet Anda di variabel <code>GOOGLE_SHEET_CSV_URL</code>.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Stats Row */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <StatCard 
                                title="Total Laporan" 
                                value={loading ? "..." : stats.total} 
                                icon="file-text" 
                                color="bg-blue-500"
                            />
                            <StatCard 
                                title="Estimasi Kerugian" 
                                value={loading ? "..." : `Rp ${(stats.totalLoss / 1000000).toFixed(0)} Jt`} 
                                icon="dollar-sign" 
                                color="bg-red-500" 
                            />
                            <StatCard 
                                title="Perlu Verifikasi" 
                                value={loading ? "..." : stats.active} 
                                icon="clock" 
                                color="bg-yellow-500" 
                            />
                        </div>

                        {/* Controls Toolbar */}
                        <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                            <div className="relative w-full md:w-96">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <Icon name="search" size={18} className="text-gray-400" />
                                </div>
                                <input
                                    type="text"
                                    className="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-lg leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm shadow-sm"
                                    placeholder="Cari nama, alamat, atau status..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            
                            <div className="flex bg-white rounded-lg border p-1 shadow-sm">
                                <button 
                                    onClick={() => setViewMode('grid')}
                                    className={`p-2 rounded ${viewMode === 'grid' ? 'bg-gray-100 text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    <Icon name="layout-grid" size={20} />
                                </button>
                                <button 
                                    onClick={() => setViewMode('table')}
                                    className={`p-2 rounded ${viewMode === 'table' ? 'bg-gray-100 text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    <Icon name="table" size={20} />
                                </button>
                            </div>
                        </div>

                        {/* Content Area */}
                        {loading ? (
                            <div className="text-center py-20">
                                <div className="loader mx-auto mb-4"></div>
                                <p className="text-gray-500">Mengambil data dari Google Sheet...</p>
                            </div>
                        ) : filteredData.length === 0 ? (
                            <div className="text-center py-20 bg-white rounded-xl border border-dashed">
                                <div className="mx-auto h-12 w-12 text-gray-400">
                                    <Icon name="search-x" size={48}/>
                                </div>
                                <h3 className="mt-2 text-sm font-medium text-gray-900">Data tidak ditemukan</h3>
                                <p className="mt-1 text-sm text-gray-500">Coba kata kunci pencarian yang lain.</p>
                            </div>
                        ) : viewMode === 'grid' ? (
                            /* GRID VIEW */
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredData.map((item) => (
                                    <div key={item.id} className="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden group">
                                        <div className="relative h-48 bg-gray-200">
                                            <img 
                                                src={item.fotoURL} 
                                                className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                                alt="Damage"
                                                onError={(e) => {e.target.src='https://placehold.co/600x400?text=No+Image'}}
                                            />
                                            <div className="absolute top-3 right-3">
                                                <StatusBadge status={item.status} />
                                            </div>
                                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-4">
                                                <p className="text-white text-sm font-medium truncate">{item.alamat}</p>
                                            </div>
                                        </div>
                                        <div className="p-5">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-gray-800 text-lg truncate pr-2">{item.nama}</h3>
                                                <span className="text-xs text-gray-500 whitespace-nowrap">{item.timestamp.split(' ')[0]}</span>
                                            </div>
                                            
                                            <div className="space-y-2 mb-4">
                                                <div className="flex items-center text-sm text-gray-600 gap-2">
                                                    <Icon name="home" size={14} className="text-blue-500"/>
                                                    <span>{item.jenisBangunan} - {item.ukuranTotal}m²</span>
                                                </div>
                                                <div className="flex items-center text-sm text-gray-600 gap-2">
                                                    <Icon name="alert-triangle" size={14} className="text-orange-500"/>
                                                    <span>Kerugian: Rp {item.kerugianAset.toLocaleString('id-ID')}</span>
                                                </div>
                                            </div>

                                            <button 
                                                onClick={() => setSelectedItem(item)}
                                                className="w-full py-2 px-4 bg-gray-50 hover:bg-blue-50 text-blue-600 font-medium rounded-lg border border-gray-200 hover:border-blue-200 transition text-sm flex justify-center items-center gap-2"
                                            >
                                                Lihat Detail <Icon name="arrow-right" size={14}/>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            /* TABLE VIEW */
                            <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="min-w-full divide-y divide-gray-200">
                                        <thead className="bg-gray-50">
                                            <tr>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nama / Tanggal</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Alamat</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Kerusakan Utama</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estimasi Kerugian</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                                <th className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white divide-y divide-gray-200">
                                            {filteredData.map((item) => (
                                                <tr key={item.id} className="hover:bg-gray-50 transition">
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <div className="flex items-center">
                                                            <div>
                                                                <div className="text-sm font-medium text-gray-900">{item.nama}</div>
                                                                <div className="text-xs text-gray-500">{item.timestamp}</div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        <div className="text-sm text-gray-900 line-clamp-1">{item.alamat}</div>
                                                        <div className="text-xs text-gray-500">RT {item.rt} / RW {item.rw}</div>
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <span className="text-xs bg-red-50 text-red-700 px-2 py-1 rounded border border-red-100">
                                                            Atap: {(item.atap || "-").split('-')[0]}
                                                        </span>
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                        Rp {item.kerugianAset.toLocaleString('id-ID')}
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <StatusBadge status={item.status} />
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                        <button 
                                                            onClick={() => setSelectedItem(item)}
                                                            className="text-blue-600 hover:text-blue-900"
                                                        >
                                                            Detail
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t mt-auto py-6">
                        <div className="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
                            &copy; 2026 BPBD DKI Provinsi DKI Jakarta - Bidang Rehabilitasi dan Rekonstruksi. All rights reserved.
                        </div>
                    </footer>

                    {/* Modal */}
                    {selectedItem && (
                        <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
