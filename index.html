        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }

<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-dark-text transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const { jsPDF } = window.jspdf;

        // --- KONFIGURASI LINK SPREADSHEET ---
        const CONFIG = {
            DATA_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSingzjvkI_INEqsjcOD2vYX5yZNOn8fikomTNU70munYuxBmjywDRrWNq0ehZTHN2OHSvVZE-xOKgN/pub?gid=1554825227&single=true&output=csv",
            USERS_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSingzjvkI_INEqsjcOD2vYX5yZNOn8fikomTNU70munYuxBmjywDRrWNq0ehZTHN2OHSvVZE-xOKgN/pub?gid=0&single=true&output=csv", 
            SETTINGS_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSingzjvkI_INEqsjcOD2vYX5yZNOn8fikomTNU70munYuxBmjywDRrWNq0ehZTHN2OHSvVZE-xOKgN/pub?gid=762390479&single=true&output=csv"
        };

        // --- HELPER FUNCTIONS ---
        const getGoogleDriveDirectLink = (url) => {
            if (!url) return "https://placehold.co/600x400?text=No+Image";
            try {
                if (url.includes("drive.google.com") || url.includes("docs.google.com")) {
                    const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (idMatch && idMatch[1]) {
                        return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
                    }
                }
                return url;
            } catch (e) {
                console.error("Error parsing image URL", e);
                return url;
            }
        };

        const parseDate = (dateStr) => {
            if (!dateStr) return new Date(0);
            const parts = dateStr.split(/[\s/:]/);
            if (parts.length >= 3) {
                return new Date(parts[2], parts[1] - 1, parts[0], parts[3] || 0, parts[4] || 0, parts[5] || 0);
            }
            return new Date(0);
        };

        // --- COMPONENTS ---

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // Theme Toggle Component
        const ThemeToggle = ({ isDark, toggleTheme }) => {
            return (
                <button 
                    onClick={toggleTheme}
                    className="p-2.5 rounded-xl transition-all bg-gray-100 text-gray-600 hover:bg-gray-200 dark:bg-dark-border dark:text-gray-300 dark:hover:bg-gray-700"
                    title={isDark ? "Beralih ke Mode Terang" : "Beralih ke Mode Gelap"}
                >
                    {isDark ? <Icon name="sun" size={20} /> : <Icon name="moon" size={20} />}
                </button>
            );
        };

        const StatusBadge = ({ status }) => {
            const safeStatus = (status || "").trim();
            const lowerStatus = safeStatus.toLowerCase();
            
            let colorClass = 'bg-gray-100 text-gray-700 border-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-700';
            
            if (lowerStatus === 'aktif' || lowerStatus === 'terverifikasi') colorClass = 'bg-green-100 text-green-700 border-green-200 dark:bg-green-900/30 dark:text-green-400 dark:border-green-800';
            else if (lowerStatus === 'verifikasi' || lowerStatus === 'diproses') colorClass = 'bg-bpbd-orange/10 text-bpbd-darkOrange border-bpbd-orange/20 dark:bg-orange-900/30 dark:text-orange-400 dark:border-orange-800';
            else if (lowerStatus === 'selesai') colorClass = 'bg-blue-100 text-blue-700 border-blue-200 dark:bg-blue-900/30 dark:text-blue-400 dark:border-blue-800';
            else if (lowerStatus === 'ditolak') colorClass = 'bg-red-100 text-red-700 border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800';
            
            return (
                <span className={`px-3 py-1 rounded-full text-xs font-semibold border ${colorClass} inline-flex items-center gap-1`}>
                    {lowerStatus === 'terverifikasi' && <Icon name="check-circle" size={12}/>}
                    {safeStatus || "Pending"}
                </span>
            );
        };

        const DamageBar = ({ label, value }) => {
            const valStr = value || "0%";
            const percentMatch = valStr.toString().match(/(\d+)%/);
            const percent = percentMatch ? parseInt(percentMatch[1]) : 0;
            
            let color = "bg-green-500";
            if(percent > 30) color = "bg-bpbd-orange";
            if(percent > 60) color = "bg-red-600";

            return (
                <div className="mb-3">
                    <div className="flex justify-between text-xs mb-1.5 font-medium">
                        <span className="text-gray-600 dark:text-gray-400">{label}</span>
                        <span className="text-gray-900 dark:text-gray-200">{valStr}</span>
                    </div>
                    <div className="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-2">
                        <div className={`h-2 rounded-full ${color} transition-all duration-500`} style={{ width: `${percent}%` }}></div>
                    </div>
                </div>
            );
        };

        // --- MOCK DATA ---
        const MOCK_USERS = [
            { Email: "subkelpk@rehabrekon.com", Password: "admin123", Role: "admin", NamaLengkap: "Administrator", Dinas: "BPBD DKI JAKARTA", NoHP: "08123456789" },
            { Email: "test@gmail.com", Password: "test", Role: "user", NamaLengkap: "User Test", Dinas: "Kelurahan Test", NoHP: "08987654321" }
        ];

        const MOCK_SETTINGS = [
            { A: "Kelurahan", B: "Jembatan Besi (Demo Mode)" },
            { A: "Pesan Admin", B: "Selamat datang di SiJITUPASNA. Pastikan data kerusakan diinput dengan akurat untuk percepatan penanganan." }
        ];

        const MOCK_DATA = [
            {
                id: "3de03a6b-206a",
                email: "test@gmail.com",
                timestamp: "23/01/2026 13:47:07",
                nama: "Bpk. Sutrisno (Contoh)",
                alamat: "Jl. Krukut Lio No. 45",
                rt: "01", rw: "04",
                luasBangunan: 1, panjangBangunan: 1, ukuranTotal: 60.00,
                atap: "Rusak Berat - 80%", dinding: "Sedang - 50%", lantai: "Baik - 0%", pondasi: "Baik - 0%",
                keterangan: "Atap roboh akibat angin kencang", jenisBangunan: "SHM",
                hargaNJOP: 1500000,
                fotoURL: "https://images.unsplash.com/photo-1583590130932-e30018897036?auto=format&fit=crop&q=80&w=800",
                pekerjaan: "Wiraswasta", penghasilan: 4500000,
                jmlKeluarga: 4, jmlAnak: 2,
                hilangPenghasilan: 0, asetTerdampak: "Rumah Tinggal", kerugianAset: 45000000,
                status: "Verifikasi"
            },
            {
                id: "dummy-admin-data",
                email: "lain@gmail.com",
                timestamp: "24/01/2026 10:00:00",
                nama: "Ibu Maryam",
                alamat: "Jl. Keagungan No. 12",
                rt: "02", rw: "05",
                luasBangunan: 45, panjangBangunan: 10, ukuranTotal: 450,
                atap: "Rusak Berat - 80%", dinding: "Rusak Berat - 70%", lantai: "Rusak Sedang - 40%", pondasi: "Sedang - 30%",
                keterangan: "Dinding retak parah", jenisBangunan: "Girik",
                hargaNJOP: 2500000,
                fotoURL: "https://images.unsplash.com/photo-1505156472234-a169b008d754?auto=format&fit=crop&q=80&w=800",
                pekerjaan: "Ibu Rumah Tangga", penghasilan: 0,
                jmlKeluarga: 5, jmlAnak: 3,
                hilangPenghasilan: 0, asetTerdampak: "Rumah Tinggal", kerugianAset: 75000000,
                status: "Terverifikasi"
            }
        ];

        // --- LOGIN PAGE ---

        const LoginPage = ({ onLogin, loading, error, isDark }) => {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin(email, password);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-dark-bg px-4 font-sans bg-pattern transition-colors duration-300">
                    <div className="max-w-md w-full bg-white dark:bg-dark-card rounded-2xl shadow-2xl overflow-hidden border border-gray-100 dark:border-dark-border">
                        <div className="bg-white dark:bg-dark-card p-8 pb-0 text-center transition-colors duration-300">
                            <div className="w-20 h-20 bg-bpbd-orange rounded-2xl rotate-3 flex items-center justify-center mx-auto mb-6 shadow-lg shadow-orange-200 dark:shadow-none">
                                <Icon name="activity" size={40} className="text-white -rotate-3" />
                            </div>
                            <h2 className="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">SiJITUPASNA</h2>
                            <p className="text-gray-500 dark:text-gray-400 text-sm mt-2 font-medium">Sistem Pengkajian Kebutuhan Pasca Bencana</p>
                        </div>
                        
                        <div className="p-8 pt-6">
                            {error && (
                                <div className="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-4 rounded-xl text-sm mb-6 flex items-start gap-3 border border-red-100 dark:border-red-900/30 shadow-sm">
                                    <Icon name="alert-triangle" size={18} className="mt-0.5 shrink-0" /> 
                                    <span>{error}</span>
                                </div>
                            )}

                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div className="space-y-1.5">
                                    <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">Email</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <Icon name="mail" size={18} className="text-gray-400 dark:text-gray-500" />
                                        </div>
                                        <input 
                                            type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
                                            className="block w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-bpbd-orange focus:border-bpbd-orange dark:text-white transition-all outline-none"
                                            placeholder="nama@instansi.com"
                                        />
                                    </div>
                                </div>
                                <div className="space-y-1.5">
                                    <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">Password</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <Icon name="lock" size={18} className="text-gray-400 dark:text-gray-500" />
                                        </div>
                                        <input 
                                            type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
                                            className="block w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-bpbd-orange focus:border-bpbd-orange dark:text-white transition-all outline-none"
                                            placeholder="••••••••"
                                        />
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-gradient-to-r from-bpbd-orange to-bpbd-darkOrange hover:from-orange-600 hover:to-orange-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-orange-200 dark:shadow-none hover:shadow-orange-300 transform hover:-translate-y-0.5 active:translate-y-0">
                                    {loading ? "Sedang Memproses..." : "Masuk Aplikasi"}
                                </button>
                            </form>
                            <div className="mt-8 pt-6 border-t border-gray-100 dark:border-gray-700 text-center text-xs text-gray-400">
                                <p className="font-medium">Demo Access:</p>
                                <p className="mt-1">Admin: subkelpk@rehabrekon.com / admin123</p>
                                <p>User: test@gmail.com / test</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD ---

        const Dashboard = ({ user, onLogout, settings, isDark, toggleTheme }) => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState("");
            const [viewMode, setViewMode] = useState("grid");
            const [sortOption, setSortOption] = useState("newest");
            const [selectedItem, setSelectedItem] = useState(null);
            const [toast, setToast] = useState(null);

            // Fetch Data
            useEffect(() => {
                const fetchData = async () => {
                    setLoading(true);
                    if (!CONFIG.DATA_URL || CONFIG.DATA_URL.includes("docs.google.com/spreadsheets/d/e/2PACX-1vR6y7q4z3F1f1r2x3g4h5i6j7k8l9m0n1o2p3q4r5s6t7u8v9w0x1y2z3a4b5c6d7e8f9g0h1i2j3k4")) {
                        setData(MOCK_DATA);
                        setLoading(false);
                        return;
                    }

                    Papa.parse(CONFIG.DATA_URL, {
                        download: true, header: true,
                        complete: (results) => {
                            const transformedData = results.data.filter(row => row.ID || row.Nama).map(row => ({
                                id: row.ID || Math.random().toString(36).substr(2, 9),
                                email: row.UserEmail || "",
                                timestamp: row.Timestamp || "",
                                nama: row.Nama || "Tanpa Nama",
                                alamat: row.Alamat || "",
                                rt: row.RT || "-", rw: row.RW || "-",
                                luasBangunan: parseFloat(row.LuasBangunan || 0),
                                panjangBangunan: row.PanjangBangunan || 0,
                                ukuranTotal: row.UkuranTotal || 0,
                                atap: row.Atap || "Baik - 0%",
                                dinding: row.Dinding || "Baik - 0%",
                                lantai: row.Lantai || "Baik - 0%",
                                pondasi: row.Pondasi || "Baik - 0%",
                                keterangan: row.Keterangan || "",
                                jenisBangunan: row.JenisBangunan || "-",
                                hargaNJOP: parseFloat((row.HargaNJOP || "0").toString().replace(/[^0-9.-]+/g,"")),
                                fotoURL: getGoogleDriveDirectLink(row.FotoURL), 
                                pekerjaan: row.Pekerjaan || "-",
                                penghasilan: parseFloat((row.Penghasilan || "0").toString().replace(/[^0-9.-]+/g,"")),
                                jmlKeluarga: row.JmlKeluarga || 0,
                                jmlAnak: row.JmlAnakSekolah || 0,
                                hilangPenghasilan: row.HilangPenghasilan || 0,
                                asetTerdampak: row.AsetTerdampak || "-",
                                kerugianAset: parseFloat((row.KerugianAset || "0").toString().replace(/[^0-9.-]+/g,"")),
                                status: row.Status || "Verifikasi"
                            }));
                            setData(transformedData);
                            setLoading(false);
                        },
                        error: () => { setData(MOCK_DATA); setLoading(false); }
                    });
                };
                fetchData();
            }, []);

            // Permission & Action Logic
            const canEditDelete = (item) => user && (user.Role === 'admin' || user.Email === item.email);
            // Permission to export CSV remains Admin only
            const canVerify = () => user && user.Role === 'admin';

            const handleUpdateStatus = (itemId, newStatus) => {
                const newData = data.map(item => item.id === itemId ? {...item, status: newStatus} : item);
                setData(newData);
                if (selectedItem && selectedItem.id === itemId) setSelectedItem({...selectedItem, status: newStatus});
                showToast("Status berhasil diperbarui (Simulasi Lokal).");
            };

            const handleDelete = (itemId) => {
                if (window.confirm("Yakin ingin menghapus data ini secara permanen?")) {
                    const newData = data.filter(item => item.id !== itemId);
                    setData(newData);
                    setSelectedItem(null);
                    showToast("Data berhasil dihapus (Simulasi Lokal).");
                }
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 4000);
            };

            // Enhanced CSV Export
            const exportAllData = () => {
                const headers = [
                    "ID", "UserEmail", "Timestamp", "Nama", "Alamat", "RT", "RW", 
                    "Luas Bangunan", "Panjang Bangunan", "Ukuran Total", 
                    "Atap", "Dinding", "Lantai", "Pondasi", "Keterangan", 
                    "Jenis Bangunan", "Harga NJOP", "Foto URL", "Pekerjaan", "Penghasilan", 
                    "Jml Keluarga", "Jml Anak Sekolah", "Hilang Penghasilan", 
                    "Aset Terdampak", "Kerugian Aset", "Status"
                ];
                
                const csvRows = [headers.join(",")];
                
                data.forEach(item => {
                    const row = [
                        item.id, 
                        item.email, 
                        item.timestamp,
                        `"${item.nama}"`, 
                        `"${item.alamat}"`, 
                        item.rt, 
                        item.rw, 
                        item.luasBangunan,
                        item.panjangBangunan,
                        item.ukuranTotal,
                        `"${item.atap}"`,
                        `"${item.dinding}"`,
                        `"${item.lantai}"`,
                        `"${item.pondasi}"`,
                        `"${item.keterangan}"`,
                        `"${item.jenisBangunan}"`,
                        item.hargaNJOP,
                        item.fotoURL,
                        `"${item.pekerjaan}"`,
                        item.penghasilan,
                        item.jmlKeluarga,
                        item.jmlAnak,
                        item.hilangPenghasilan,
                        `"${item.asetTerdampak}"`,
                        item.kerugianAset,
                        item.status
                    ];
                    csvRows.push(row.join(","));
                });
                
                const blob = new Blob([csvRows.join("\n")], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'Laporan_Lengkap_SiJITUPASNA.csv'; a.click();
            };

            // Enhanced PDF Generator
            const generatePDF = (item) => {
                const doc = new jsPDF();
                
                // Header (Keep colors consistent for branding)
                doc.setFillColor(249, 115, 22); 
                doc.rect(0, 0, 210, 5, 'F');
                doc.setFillColor(30, 64, 175); 
                doc.rect(0, 5, 210, 40, 'F');
                
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(24);
                doc.setFont("helvetica", "bold");
                doc.text("SiJITUPASNA", 105, 25, null, null, "center");
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                doc.text("Laporan Verifikasi Kerusakan & Kerugian Pasca Bencana", 105, 35, null, null, "center");

                doc.setTextColor(0, 0, 0);
                doc.setFontSize(12);
                let y = 60;

                doc.setFont("helvetica", "bold");
                doc.text(`ID Laporan: ${item.id}`, 20, y);
                doc.text(`Status: ${item.status}`, 20, y + 6);
                
                if (item.fotoURL && !item.fotoURL.includes("placehold.co")) {
                    try {
                        doc.addImage(item.fotoURL, 'JPEG', 140, 55, 50, 35);
                    } catch (e) {
                        doc.setFontSize(8);
                        doc.setTextColor(150);
                        doc.text("(Foto tidak tersedia)", 140, 70);
                    }
                }
                
                y = 100; 

                const details = [
                    [{content: 'DATA PELAPOR', colSpan: 2, styles: {fillColor: [220, 220, 220], fontStyle: 'bold'}}],

                                                    <div><p className="text-xs text-gray-500 dark:text-gray-400 mb-1">Pekerjaan</p><p className="font-medium">{selectedItem.pekerjaan}</p></div>
                                                    <div className="col-span-2 border-t border-dashed border-gray-200 dark:border-gray-700 my-1 pt-2">
                                                        <p className="text-xs text-gray-500 dark:text-gray-400 mb-1">Alamat Lengkap</p>
                                                        <p className="font-medium">{selectedItem.alamat}</p>
                                                        <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">RT {selectedItem.rt} / RW {selectedItem.rw}</p>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                                                <h3 className="font-bold text-gray-900 dark:text-white text-lg mb-4 flex items-center gap-2">
                                                    <Icon name="bar-chart-2" size={20} className="text-bpbd-orange"/> Analisa Kerusakan
                                                </h3>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                                    <div className="bg-gray-50 dark:bg-gray-700/50 p-4 rounded-xl border border-gray-100 dark:border-gray-600">
                                                        <p className="text-xs text-gray-500 dark:text-gray-400 mb-1">Estimasi Kerugian</p>
                                                        <p className="text-xl font-extrabold text-red-600 dark:text-red-400">Rp {selectedItem.kerugianAset.toLocaleString('id-ID')}</p>
                                                    </div>
                                                    <div className="bg-gray-50 dark:bg-gray-700/50 p-4 rounded-xl border border-gray-100 dark:border-gray-600">
                                                        <p className="text-xs text-gray-500 dark:text-gray-400 mb-1">Jenis Aset</p>
                                                        <p className="text-lg font-bold text-gray-800 dark:text-gray-200">{selectedItem.jenisBangunan}</p>
                                                    </div>
                                                </div>
                                                <div className="space-y-1">
                                                    <DamageBar label="Kondisi Atap" value={selectedItem.atap} />
                                                    <DamageBar label="Kondisi Dinding" value={selectedItem.dinding} />
                                                    <DamageBar label="Kondisi Lantai" value={selectedItem.lantai} />
                                                    <DamageBar label="Kondisi Pondasi" value={selectedItem.pondasi} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="bg-white dark:bg-dark-card border-t border-gray-200 dark:border-gray-700 px-8 py-5 flex justify-between items-center">
                                    {canEditDelete(selectedItem) ? (
                                        <button onClick={() => handleDelete(selectedItem.id)} className="text-red-600 dark:text-red-400 font-medium hover:underline text-sm flex items-center gap-2"><Icon name="trash-2" size={16}/> Hapus Data</button>
                                    ) : <div></div>}

                                    <div className="flex gap-4">
                                        <button onClick={() => setSelectedItem(null)} className="px-6 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-bold rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 transition">Tutup</button>
                                        
                                        {/* Button PDF always visible for all users */}
                                        <button 
                                            onClick={() => generatePDF(selectedItem)}
                                            className="px-6 py-2.5 bg-bpbd-blue text-white font-bold rounded-xl hover:bg-blue-900 transition flex items-center gap-2 shadow-lg shadow-blue-200 dark:shadow-none"
                                        >
                                            <Icon name="printer" size={18}/> Cetak PDF Lengkap
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- MAIN APP ---

        function App() {
            const [user, setUser] = useState(null);
            const [settings, setSettings] = useState([]);
            const [loadingUser, setLoadingUser] = useState(false);
            const [loginError, setLoginError] = useState("");
            const [isDark, setIsDark] = useState(false);
            
            // Initial Load: User & Theme
            useEffect(() => {
                // Load User
                const storedUser = localStorage.getItem('siGapUser');
                if (storedUser) setUser(JSON.parse(storedUser));
                
                // Load Theme
                const storedTheme = localStorage.getItem('theme');
                if (storedTheme === 'dark') {
                    setIsDark(true);
                    document.documentElement.classList.add('dark');
                } else {
                    setIsDark(false);
                    document.documentElement.classList.remove('dark');
                }

                fetchSettings();
            }, []);

            const toggleTheme = () => {
                const newTheme = !isDark;
                setIsDark(newTheme);
                if (newTheme) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            };

            const fetchSettings = () => {
                if (!CONFIG.SETTINGS_URL) {
                    setSettings(MOCK_SETTINGS.map(s => ({ key: s.A, value: s.B })));
                    return;
                }
                Papa.parse(CONFIG.SETTINGS_URL, {
                    download: true, header: false,
                    complete: (results) => {
                        const parsedSettings = results.data.slice(1).map(row => ({ key: row[0], value: row[1] })).filter(s => s.key);
                        setSettings(parsedSettings);
                    }
                });
            };

            const handleLogin = (email, password) => {
                setLoadingUser(true);
                setLoginError("");

                if (!CONFIG.USERS_URL) {
                    setTimeout(() => {
                        const foundUser = MOCK_USERS.find(u => u.Email === email && u.Password === password);
                        if (foundUser) {
                            setUser(foundUser);
                            localStorage.setItem('siGapUser', JSON.stringify(foundUser));
                        } else {
                            setLoginError("Kombinasi Email dan Password tidak ditemukan.");
                        }
                        setLoadingUser(false);
                    }, 1000);
                    return;
                }

                Papa.parse(CONFIG.USERS_URL, {
                    download: true, header: true,
                    complete: (results) => {
                        const users = results.data;
                        const foundUser = users.find(u => u.Email?.trim() === email.trim() && u.Password?.trim() === password.trim());
                        if (foundUser) {
                            setUser(foundUser);
                            localStorage.setItem('siGapUser', JSON.stringify(foundUser));
                        } else {
                            setLoginError("Kombinasi Email dan Password tidak ditemukan.");
                        }
                        setLoadingUser(false);
                    },
                    error: () => { setLoginError("Gagal menghubungi database user."); setLoadingUser(false); }
                });
            };

            const handleLogout = () => { setUser(null); localStorage.removeItem('siGapUser'); };

            return (
                <div>
                    {!user ? <LoginPage onLogin={handleLogin} loading={loadingUser} error={loginError} isDark={isDark} /> : 
                             <Dashboard user={user} onLogout={handleLogout} settings={settings} isDark={isDark} toggleTheme={toggleTheme} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
